<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Courses — Enterprise LMS</title>
<link rel="stylesheet" href="../assets/css/design-system.css">
<style>
  .module-block { margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--border); }
  .module-block:last-child { border-bottom:none; }
  .video-embed { width:100%; aspect-ratio:16/9; border:none; border-radius:var(--radius-md); background:#000; }
  .quiz-question { margin-bottom:18px; }
  .quiz-choice { display:flex; align-items:center; gap:8px; padding:8px 0; font-size:14.5px; }
  .quiz-result-pass { color:#047857; font-weight:700; }
  .quiz-result-fail { color:#b91c1c; font-weight:700; }
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/images/logo.png" alt="" class="brand-logo-slot" onerror="this.style.display='none'">
      <span class="brand-name-slot">Enterprise LMS</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
      <a href="courses.html" class="nav-link active">📚 My Courses</a>
      <a href="ai-mentor.html" class="nav-link">🤖 AI Mentor</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip"><span class="u-name" id="currentUserName"></span><span class="u-role" id="currentUserRole"></span></div>
      <button class="btn-logout" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div><h1>My Courses</h1><p class="text-muted">Your trainings, and what's available to join</p></div>
    </header>
    <section class="content">
      <div id="alertBox" class="hidden"></div>

      <h2 class="mb-16">My trainings</h2>
      <div id="myCourses" class="mb-24"><p class="text-muted">Loading…</p></div>

      <h2 class="mb-16">Available trainings</h2>
      <div id="availableCourses"><p class="text-muted">Loading…</p></div>
    </section>
  </main>
</div>

<div class="modal-backdrop hidden" id="viewModal">
  <div class="modal" style="max-width:580px;">
    <div class="modal-header"><h2 id="viewTitle">Training</h2><button class="modal-close" id="closeViewModal">&times;</button></div>
    <div id="viewAlert" class="hidden"></div>
    <p class="text-muted mb-16" id="viewDescription"></p>
    <div id="viewModules" class="mb-24"></div>
    <div id="progressSection"></div>
  </div>
</div>

<div class="modal-backdrop hidden" id="quizModal">
  <div class="modal" style="max-width:580px;">
    <div class="modal-header"><h2 id="quizModalTitle">Quiz</h2><button class="modal-close" id="closeQuizModal">&times;</button></div>
    <div id="quizModalAlert" class="hidden"></div>
    <div id="quizBody"></div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script>
  requireAuth(['Trainee']);

  let myEnrollments = [];
  let availableCourses = [];
  let activeCourseId = null;
  let activeQuizModuleId = null;

  async function loadAll() {
    try {
      const [mine, all] = await Promise.all([apiFetch('/courses/mine'), apiFetch('/courses')]);
      myEnrollments = mine;
      const enrolledIds = mine.map((m) => m.course_id);
      availableCourses = all.filter((c) => !enrolledIds.includes(c.course_id));
      renderMine();
      renderAvailable();
    } catch (err) {
      showAlert(document.getElementById('alertBox'), err.message);
    }
  }

  function renderMine() {
    const el = document.getElementById('myCourses');
    el.innerHTML = myEnrollments.length ? myEnrollments.map((e) => `
      <div class="card mb-16">
        <div class="flex-between" style="margin-bottom:10px;">
          <strong>${escapeHtml(e.title)}</strong>
          <span class="badge ${statusBadgeClass(e.status)}">${escapeHtml(e.status)}</span>
        </div>
        <div class="progress-track mb-16"><div class="progress-fill" style="width:${e.progress}%;"></div></div>
        <div class="flex-between">
          <span class="text-muted">${e.status === 'Pending Request' ? 'Request sent' : e.progress + '% complete'}</span>
          ${e.status === 'Pending Request' ? '<span class="text-muted">Waiting for approval</span>' : `<button class="btn btn-primary btn-sm" onclick="openCourse(${e.course_id})">Open</button>`}
        </div>
      </div>`).join('') : '<div class="empty-state card">You are not in any training yet. Join one from the list below, or wait for your supervisor to enroll you.</div>';
  }

  function renderAvailable() {
    const el = document.getElementById('availableCourses');
    el.innerHTML = availableCourses.length ? availableCourses.map((c) => `
      <div class="card mb-16">
        <div class="flex-between">
          <div>
            <strong>${escapeHtml(c.title)}</strong>
            <p class="text-muted mt-8">${escapeHtml(c.description || 'No description provided.')}</p>
          </div>
          <button class="btn btn-primary btn-sm" onclick="requestEnroll(${c.course_id})">Request to Join</button>
        </div>
      </div>`).join('') : '<div class="empty-state card">No other trainings are published right now. Check back later.</div>';
  }

  window.requestEnroll = async function (courseId) {
    try {
      await apiFetch(`/courses/${courseId}/request-enroll`, { method: 'POST' });
      toast('Request sent. Waiting for approval.');
      loadAll();
    } catch (err) {
      showAlert(document.getElementById('alertBox'), err.message);
    }
  };

  function getEmbedUrl(url) {
    if (!url) return null;
    const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{6,})/);
    if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
    const vimeo = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (vimeo) return `https://player.vimeo.com/video/${vimeo[1]}`;
    return null;
  }

  function renderModuleContent(m) {
    if (m.module_type === 'video') {
      const embed = getEmbedUrl(m.video_url);
      if (embed) {
        return `<iframe class="video-embed" src="${escapeHtml(embed)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      }
      if (m.video_url) {
        return `<video class="video-embed" controls><source src="${escapeHtml(m.video_url)}"></video>`;
      }
      return '<p class="text-muted">No video link set yet.</p>';
    }
    if (m.module_type === 'quiz') {
      const attempt = m.myLatestAttempt;
      return `
        ${attempt ? `<p class="text-muted mb-16">Last attempt: ${attempt.score}/${attempt.total_questions} — <span class="${attempt.passed ? 'quiz-result-pass' : 'quiz-result-fail'}">${attempt.passed ? 'Passed' : 'Not yet passed'}</span></p>` : ''}
        <button class="btn btn-primary" onclick="openQuiz(${m.module_id})">${attempt ? 'Retake Quiz' : 'Take Quiz'} (${m.question_count || 0} questions)</button>`;
    }
    return `<p class="text-muted">${escapeHtml(m.content || '')}</p>`;
  }

  window.openCourse = async function (courseId) {
    activeCourseId = courseId;
    let detail;
    try { detail = await apiFetch(`/courses/${courseId}`); }
    catch (err) { toast(err.message, 'error'); return; }
    document.getElementById('viewTitle').textContent = detail.title;
    document.getElementById('viewDescription').textContent = detail.description || '';

    for (const m of detail.modules) {
      if (m.module_type === 'quiz') {
        try {
          const q = await apiFetch(`/quiz/${m.module_id}`);
          m.myLatestAttempt = q.myLatestAttempt;
          m.question_count = q.questions.length;
        } catch { /* leave as-is if it fails to load */ }
      }
    }

    document.getElementById('viewModules').innerHTML = detail.modules.length
      ? detail.modules.map((m, i) => `
          <div class="module-block">
            <strong>${i + 1}. ${escapeHtml(m.title)}</strong>
            <div class="mt-8">${renderModuleContent(m)}</div>
          </div>`).join('')
      : '<div class="empty-state">No content added yet. Check back soon.</div>';

    const enrollment = detail.myEnrollment;
    if (enrollment && enrollment.status !== 'Pending Request') {
      document.getElementById('progressSection').innerHTML = `
        <h3 class="mb-16">My progress</h3>
        <div class="progress-track mb-16"><div class="progress-fill" style="width:${enrollment.progress}%;"></div></div>
        <div class="form-row" style="align-items:end;">
          <div class="form-group" style="margin-bottom:0;"><label>Update progress (%)</label><input type="number" min="0" max="100" id="progressInput" value="${enrollment.progress}"></div>
          <button class="btn btn-primary" onclick="updateMyProgress(${courseId})">Save Progress</button>
        </div>`;
    } else {
      document.getElementById('progressSection').innerHTML = (enrollment ? '<p class="text-muted">Your request is pending approval.</p>' : '<p class="text-muted">You are not enrolled in this training.</p>');
    }
    document.getElementById('viewModal').classList.remove('hidden');
  };

  window.updateMyProgress = async function (courseId) {
    const progress = document.getElementById('progressInput').value;
    try {
      await apiFetch(`/courses/${courseId}/enroll/${getUser().id}`, { method: 'PUT', body: JSON.stringify({ progress: Number(progress) }) });
      document.getElementById('viewModal').classList.add('hidden');
      toast('Progress saved');
      loadAll();
    } catch (err) {
      toast(err.message, 'error');
    }
  };

  document.getElementById('closeViewModal').addEventListener('click', () => document.getElementById('viewModal').classList.add('hidden'));

  window.openQuiz = async function (moduleId) {
    activeQuizModuleId = moduleId;
    document.getElementById('viewModal').classList.add('hidden');
    document.getElementById('quizModal').classList.remove('hidden');
    document.getElementById('quizModalAlert').classList.add('hidden');
    const body = document.getElementById('quizBody');
    body.innerHTML = '<p class="text-muted">Loading…</p>';

    try {
      const quiz = await apiFetch(`/quiz/${moduleId}`);
      document.getElementById('quizModalTitle').textContent = quiz.title;
      body.innerHTML = `
        <p class="text-muted mb-16">Passing score: ${quiz.pass_percent}%</p>
        ${quiz.questions.map((q, qi) => `
          <div class="quiz-question">
            <strong>${qi + 1}. ${escapeHtml(q.question_text)}</strong>
            ${q.choices.map((c) => `
              <label class="quiz-choice">
                <input type="radio" name="q-${q.question_id}" value="${c.choice_id}">
                ${escapeHtml(c.choice_text)}
              </label>`).join('')}
          </div>`).join('')}
        <button class="btn btn-primary" style="width:100%;" onclick="submitQuiz(${moduleId})">Submit Quiz</button>
        <div id="quizResult" class="hidden mt-16"></div>`;
    } catch (err) {
      body.innerHTML = `<p class="text-muted">Could not load quiz: ${escapeHtml(err.message)}</p>`;
    }
  };

  window.submitQuiz = async function (moduleId) {
    const body = document.getElementById('quizBody');
    const radios = body.querySelectorAll('input[type="radio"]:checked');
    const answers = {};
    radios.forEach((r) => {
      const qId = r.name.replace('q-', '');
      answers[qId] = r.value;
    });

    try {
      const result = await apiFetch(`/quiz/${moduleId}/submit`, { method: 'POST', body: JSON.stringify({ answers }) });
      const resultEl = document.getElementById('quizResult');
      resultEl.classList.remove('hidden');
      resultEl.innerHTML = `
        <div class="card" style="text-align:center;">
          <h3 class="mb-8">${result.score} / ${result.total} correct (${result.percent}%)</h3>
          <p class="${result.passed ? 'quiz-result-pass' : 'quiz-result-fail'} mb-16">${result.passed ? '✓ Passed' : `Not yet passed — need ${result.pass_percent}%`}</p>
          <button class="btn btn-secondary" onclick="document.getElementById('quizModal').classList.add('hidden'); openCourse(${activeCourseId});">Back to Course</button>
          <button class="btn btn-primary" onclick="openQuiz(${moduleId})">Retake</button>
        </div>`;
    } catch (err) {
      showAlert(document.getElementById('quizModalAlert'), err.message);
    }
  };

  document.getElementById('closeQuizModal').addEventListener('click', () => {
    document.getElementById('quizModal').classList.add('hidden');
    openCourse(activeCourseId);
  });

  loadAll();
</script>
</body>
</html>
