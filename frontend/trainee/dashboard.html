<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Enterprise LMS</title>
<link rel="stylesheet" href="../assets/css/design-system.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/images/logo.png" alt="" class="brand-logo-slot" onerror="this.style.display='none'">
      <span class="brand-name-slot">Enterprise LMS</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link active">📊 Dashboard</a>
      <a href="courses.html" class="nav-link">📚 My Courses</a>
      <a href="ai-mentor.html" class="nav-link">🤖 AI Mentor</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip"><span class="u-name" id="currentUserName"></span><span class="u-role" id="currentUserRole"></span></div>
      <button class="btn-logout" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div><h1>My Dashboard</h1><p class="text-muted">Your training progress</p></div>
    </header>
    <section class="content">
      <div id="alertBox" class="hidden"></div>
      <div class="stat-grid" id="statGrid">
        <div class="stat-card"><div class="stat-label">Loading…</div></div>
      </div>

      <div class="card">
        <div class="flex-between mb-16"><h2>Recent trainings</h2><a href="courses.html" class="btn btn-secondary btn-sm">View all</a></div>
        <div id="courseList"><p class="text-muted">Loading…</p></div>
      </div>
    </section>
  </main>
</div>

<script src="../assets/js/api.js"></script>
<script>
  requireAuth(['Trainee']);

  async function loadDashboard() {
    try {
      const d = await apiFetch('/dashboard/trainee');
      document.getElementById('statGrid').innerHTML = `
        <div class="stat-card"><div class="stat-label">Enrolled</div><div class="stat-value">${d.enrolled}</div></div>
        <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value">${d.completed}</div></div>
        <div class="stat-card"><div class="stat-label">Pending / In Progress</div><div class="stat-value">${d.pending}</div></div>
      `;
      document.getElementById('courseList').innerHTML = d.recent_courses.length
        ? d.recent_courses.map((c) => `
            <div class="mb-16">
              <div class="flex-between" style="margin-bottom:6px;">
                <strong>${escapeHtml(c.title)}</strong>
                <span class="badge ${statusBadgeClass(c.status)}">${escapeHtml(c.status)}</span>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${c.progress}%;"></div></div>
            </div>`).join('')
        : '<p class="text-muted">You are not enrolled in any trainings yet. Check "My Courses" to browse what\'s available.</p>';
    } catch (err) {
      showAlert(document.getElementById('alertBox'), err.message);
    }
  }
  loadDashboard();
</script>
</body>
</html>
