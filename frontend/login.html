<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In </title>
<link rel="stylesheet" href="assets/css/design-system.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img src="assets/images/logo.png" alt="Company logo" class="brand-logo-slot" onerror="this.style.display='none'">
      <h1 class="brand-name-slot">Account Login</h1>
      <p>Sign in to your training portal</p>
    </div>

    <div id="alertBox" class="hidden"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Sign In</button>
      <a href="index.html"><p class="text-muted" style="text-align:center; margin-top:14px;">Return to website</p></a>
    </form>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
  (function redirectIfLoggedIn() {
    const user = getUser();
    if (user && getToken()) {
      window.location.href = `${user.role.toLowerCase()}/dashboard.html`;
    }
  })();

  document.getElementById('togglePassword').addEventListener('click', () => {
    const input = document.getElementById('password');
    const btn = document.getElementById('togglePassword');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.textContent = isHidden ? 'Hide' : 'Show';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('loginBtn');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';
    alertBox.classList.add('hidden');

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username, password })
      });
      setSession(data.token, data.user);
      window.location.href = `${data.user.role.toLowerCase()}/dashboard.html`;
    } catch (err) {
      showAlert(alertBox, err.message || 'Could not sign in.');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
