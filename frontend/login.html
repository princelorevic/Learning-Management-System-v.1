<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Enterprise LMS</title>
<link rel="icon" type="image/x-icon" href="./assets/images/tab-logo.png"">
<link rel="stylesheet" href="assets/css/design-system.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img src="assets/images/logo.png" alt="Company logo" class="brand-logo-slot" onerror="this.style.display='none'" >
      <h1 class="brand-name-slot">Account Login</h1>
      <p>Sign in to your training portal</p>
    </div>

    <div id="alertBox" class="hidden"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Sign In</button>
      <a href="index.html" class="login-brand"> <p>Return to Website</p></a>
    </form>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
  // If already logged in, skip straight to the right dashboard
  (function redirectIfLoggedIn() {
    const user = getUser();
    if (user && getToken()) {
      window.location.href = `${user.role.toLowerCase()}/dashboard.html`;
    }
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('loginBtn');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';
    alertBox.classList.add('hidden');

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username, password })
      });
      setSession(data.token, data.user);
      window.location.href = `${data.user.role.toLowerCase()}/dashboard.html`;
    } catch (err) {
      showAlert(alertBox, err.message || 'Could not sign in.');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
