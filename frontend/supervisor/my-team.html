<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team — Enterprise LMS</title>
<link rel="stylesheet" href="../assets/css/design-system.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/images/logo.png" alt="" class="brand-logo-slot" onerror="this.style.display='none'">
      <span class="brand-name-slot">Enterprise LMS</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
      <a href="my-team.html" class="nav-link active">👥 My Team</a>
      <a href="trainings.html" class="nav-link">📚 Trainings</a>
      <a href="reports.html" class="nav-link">📈 Reports</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip"><span class="u-name" id="currentUserName"></span><span class="u-role" id="currentUserRole"></span></div>
      <button class="btn-logout" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div><h1>My Team</h1><p class="text-muted">Everyone reporting to you</p></div>
    </header>
    <section class="content">
      <div id="alertBox" class="hidden"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Department</th><th>Learning Style</th><th>Trainings Enrolled</th><th>Completed</th></tr></thead>
          <tbody id="teamTable"><tr><td colspan="5" class="text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="../assets/js/api.js"></script>
<script>
  requireAuth(['Supervisor']);

  async function loadTeam() {
    try {
      const d = await apiFetch('/dashboard/supervisor');
      document.getElementById('teamTable').innerHTML = d.team.length
        ? d.team.map((t) => `
            <tr>
              <td><strong>${escapeHtml(t.name)}</strong></td>
              <td>${escapeHtml(t.department || '—')}</td>
              <td>${escapeHtml(t.learning_style || 'Not Assessed')}</td>
              <td>${t.enrolled_count}</td>
              <td>${t.completed_count}</td>
            </tr>`).join('')
        : '<tr><td colspan="5" class="text-muted">No trainees assigned to you yet.</td></tr>';
    } catch (err) {
      showAlert(document.getElementById('alertBox'), err.message);
    }
  }
  loadTeam();
</script>
</body>
</html>
